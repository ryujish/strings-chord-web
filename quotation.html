<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>카카오톡 상담 안내 | 스트링스 코드 (STRINGS CHORD)</title>
  <style>
    :root {
      --ink: #17213a;
      --gold: #a67c1e;
      --muted: #5b6474;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 32px 20px;
      background: #f4f6f9;
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.6;
    }

    main {
      max-width: 720px;
      margin: 0 auto;
      padding: 56px 48px;
      background: #fff;
      border: 1px solid #e1e5ec;
      border-radius: 12px;
      box-shadow: 0 12px 35px rgba(23, 33, 58, 0.08);
      text-align: center;
    }

    .brand {
      color: var(--gold);
      font-size: 0.85rem;
      font-weight: 800;
      letter-spacing: 0.16em;
    }

    h1 { margin: 18px 0 12px; font-size: 2.2rem; }
    p { color: var(--muted); }

    ul {
      max-width: 420px;
      margin: 28px auto;
      padding: 0;
      list-style: none;
      text-align: left;
    }

    li { padding: 10px 0; border-bottom: 1px solid #edf0f4; }
    li::before { content: "✓"; margin-right: 10px; color: var(--gold); font-weight: 800; }

    .btn {
      display: inline-block;
      margin-top: 10px;
      padding: 14px 24px;
      border-radius: 999px;
      background: #fee500;
      color: #191919;
      font-weight: 800;
      text-decoration: none;
    }

    .back { display: block; margin-top: 24px; color: var(--muted); font-size: 0.9rem; }

    @media (max-width: 560px) {
      main { padding: 40px 24px; }
      h1 { font-size: 1.8rem; }
    }
  </style>
</head>
<body>
  <main>
    <div class="brand">STRINGS CHORD</div>
    <h1>카카오톡으로 상담받으세요</h1>
    <p>행사에 맞는 편성과 프로그램을 안내해 드립니다.<br>아래 내용을 준비해 카카오톡으로 보내주세요.</p>
    <ul>
      <li>행사 예정일과 장소</li>
      <li>행사 유형과 희망 연주 편성</li>
      <li>원하시는 분위기와 특별 요청사항</li>
    </ul>
    <a class="btn" href="https://pf.kakao.com/?lang=ko" target="_blank" rel="noopener">💬 카카오톡 빠른 상담 시작</a>
    <p>카카오톡에서 <strong>@스트링스코드</strong>를 검색해 주세요.</p>
    <a class="back" href="index.html">← 스트링스 코드 홈페이지로 돌아가기</a>
  </main>
</body>
</html>
