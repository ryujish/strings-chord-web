name: Deploy to Server

on:
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy
        env:
          SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
          SERVER_IP: "155.248.163.95"
        run: |
          install -m 600 /dev/null "$RUNNER_TEMP/ssh-key"
          if [[ "$SSH_KEY" == *'\n'* ]]; then
            printf '%b\n' "$SSH_KEY" > "$RUNNER_TEMP/ssh-key"
          else
            printf '%s\n' "$SSH_KEY" > "$RUNNER_TEMP/ssh-key"
          fi
          chmod 600 "$RUNNER_TEMP/ssh-key"
          ssh_opts=(-i "$RUNNER_TEMP/ssh-key" -o StrictHostKeyChecking=accept-new -o PubkeyAcceptedAlgorithms=+ssh-ed25519)
          
          # Prepare directory on server
          ssh "${ssh_opts[@]}" ubuntu@$SERVER_IP "sudo mkdir -p /opt/strings-chord && sudo chown ubuntu:ubuntu /opt/strings-chord"
          
          # Create tar archive
          tar -czf "$RUNNER_TEMP/deploy.tar.gz" --exclude=.git --exclude=node_modules --exclude=dist .
          
          # Upload
          scp "${ssh_opts[@]}" "$RUNNER_TEMP/deploy.tar.gz" ubuntu@$SERVER_IP:/tmp/deploy.tar.gz
          
          # Extract and deploy
          ssh "${ssh_opts[@]}" ubuntu@$SERVER_IP "tar -xzf /tmp/deploy.tar.gz -C /opt/strings-chord && rm -f /tmp/deploy.tar.gz"
          ssh "${ssh_opts[@]}" ubuntu@$SERVER_IP "cd /opt/strings-chord && sudo docker compose up -d --build"
